<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>

    <h1>Blog Management System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="add-blog.html">Add Blog</a>
    </nav>

</header>

<main>

    <div class="form-container">

        <h2>Add New Blog</h2>

        <form id="blogForm">

    <label>Blog Title</label>
    <input
        type="text"
        id="title"
        placeholder="Enter blog title">

    <label>Author</label>
    <input
        type="text"
        id="author"
        placeholder="Enter author name">

    <label>Content</label>
    <textarea
        id="content"
        rows="6"
        placeholder="Write your blog here..."></textarea>

    <button type="submit">
        Publish Blog
    </button>

</form>

<p id="message"></p>

    </div>

</main>

<footer>

    <p>© 2026 Blog Management System</p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
